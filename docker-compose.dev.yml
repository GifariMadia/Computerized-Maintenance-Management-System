# Development override: run database + MinIO (+ bucket init) in Docker while running Go & Next.js natively
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres minio minio-init
services:
  postgres:
    ports:
      - "${POSTGRES_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
  minio:
    ports:
      - "${MINIO_BIND_ADDR:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDR:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
